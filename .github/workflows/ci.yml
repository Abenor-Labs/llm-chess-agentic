name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chess
          POSTGRES_PASSWORD: chess
          POSTGRES_DB: chess
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chess -d chess"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Unit + integration tests run against this database; the e2e server too.
      TEST_DATABASE_URL: postgresql://chess:chess@localhost:5432/chess
      DATABASE_URL: postgresql://chess:chess@localhost:5432/chess
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + database tests
        run: pnpm test

      - name: Migrate and seed (for e2e)
        run: pnpm db:setup

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests (builds and starts production)
        run: pnpm test:e2e
        env:
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
